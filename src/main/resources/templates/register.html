<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
	       body {
	         background-image: radial-gradient( circle 1091px at 106.5% 111.5%,  rgba(250,246,213,1) 0.1%, rgba(218,147,93,1) 42.2%, rgba(137,86,67,1) 74.3%, rgba(67,39,39,1) 100.2% );
             display: flex;
	           justify-content: center;
	           align-items: center;
	           min-height: 100vh;
	           margin: 0;
	       }
         
	       .form-container {
	           
	           width: 40%;
	           padding: 40px;
	          border-radius: 20px;
	           box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           -webkit-box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           -moz-box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           background-image: linear-gradient( 109.6deg,  rgba(255,253,208,1) 11.2%, rgba(153,102,51,1) 91% );

	           animation: fadeSlide 2s ease;
	       }
	       .form-title {
	           text-align: center;
	           color: #674f04; 
            font-family: serif;
            font-weight: 900;
	           margin-bottom: 30px;
	           animation: fadeIn 5s ease;
	       }
	       label {
	           color: #a28f70; 
            font-weight: 600;
	       }
	       .form-control, .form-select {
	           margin-bottom: 25px;
	       }
	      .btn-primary {
           background: #F0C27B;  /* fallback for old browsers */
background: -webkit-linear-gradient(to right, #4B1248, #F0C27B);  /* Chrome 10-25, Safari 5.1-6 */
background: linear-gradient(to right, #4B1248, #F0C27B); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */

             font-weight: 700;
            font-family: serif;
        
          border-color: #7b3306;
        }
        .btn-primary:hover {
      background: #603813;  /* fallback for old browsers */
background: -webkit-linear-gradient(to right, #b29f94, #603813);  /* Chrome 10-25, Safari 5.1-6 */
background: linear-gradient(to right, #b29f94, #603813); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */


           border-color: #7b3306;
            font-weight: 700;
            font-family: serif;
        }

	       @keyframes fadeSlide {
	           from {
	               opacity: 0;
	               transform: translateY(-20px);
	           }
	           to {
	               opacity: 1;
	               transform: translateY(0);
	           }
	       }
	       @keyframes fadeIn {
	           from { opacity: 0; }
	           to { opacity: 1; }
	       }
	   </style>
</head>
<body>
<div class="form-container">
    <h2 class="form-title">Register</h2>
    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" name="username" id="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <select name="role" id="role" class="form-select" required>
                <option value="PATIENT">PATIENT</option>
                <option value="DOCTOR">DOCTOR</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
