<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Assign Medication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: radial-gradient( circle 1091px at 106.5% 111.5%,  rgba(250,246,213,1) 0.1%, rgba(218,147,93,1) 42.2%, rgba(137,86,67,1) 74.3%, rgba(67,39,39,1) 100.2% );
           
        }
        .form-container {
            max-width: 600px;
            margin: 80px auto;
            padding: 30px;
            box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           -webkit-box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           -moz-box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           background-image: linear-gradient( 109.6deg,  rgba(255,253,208,1) 11.2%, rgba(153,102,51,1) 91% );
           border-radius: 15px;
            animation: fadeSlide 0.6s ease;
        }
        .form-title {
            color: #674f04; 
            font-family: serif;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
        }
        label {
            color: #a28f70; 
            font-weight: 600;
        }
        .form-control, .btn {
            margin-bottom: 20px;
        }
        .btn-primary {
            background-image: radial-gradient( circle 1588px at -27.3% 144%,  rgba(255,22,22,1) 0%, rgba(0,0,0,1) 43.4%, rgba(0,0,0,1) 65.8%, rgba(255,22,22,1) 100.2% );
          font-weight: 500;
            border-color: oklch(0.286 0.066 53.813);
            color: oklch(0.98 0.016 73.684);
        }
        .btn-primary:hover {
            background-image: linear-gradient( 100.1deg,  rgba(217,157,38,1) 16.8%, rgba(247,213,110,1) 77.3% ); 
           font-weight: 800;
           color: oklch(0.286 0.066 53.813);
            border-color: #023e8a;
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2 class="form-title">Assign Medication</h2>
    <form th:action="@{/medications/assign}" method="post">
        <div class="mb-3">
            <label for="patientId" class="form-label">Select Patient:</label>
            <select id="patientId" name="patientId" class="form-select" required>
                <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.username}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="medicationName" class="form-label">Medicine Name:</label>
            <input type="text" id="medicationName" name="medicationName" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="dosage" class="form-label">Dosage:</label>
            <input type="text" id="dosage" name="dosage" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="instructions" class="form-label">Instructions:</label>
            <textarea id="instructions" name="instructions" class="form-control" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Assign</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
