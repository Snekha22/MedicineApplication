<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Medications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
           background-image: radial-gradient( circle 1091px at 106.5% 111.5%,  rgba(250,246,213,1) 0.1%, rgba(218,147,93,1) 42.2%, rgba(137,86,67,1) 74.3%, rgba(67,39,39,1) 100.2% );

        }
        .table-container {
            max-width: 1000px;
            margin: 200px auto;
            padding: 50px;
           box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           -webkit-box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           -moz-box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           background-image: linear-gradient( 109.6deg,  rgba(255,253,208,1) 11.2%, rgba(153,102,51,1) 91% );
           font-weight: 500;
           border-radius: 15px;
           animation: slideIn 0.8s ease-out forwards;
          
        }
        .table-title {
         
            color:#674f04;
            font-family: serif;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 900;
        }
        table {
            margin-top: 50px;
            width: 100%;
        
            
           }
        

        th {
        
        background-image: linear-gradient( 100.1deg,  rgba(217,157,38,1) 16.8%, rgba(247,213,110,1) 77.3% );
        color: white;
          padding: 15px;
          text-align: center;
          
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="table-container">
    <h2 class="table-title">Medications</h2>
    <div class="table-responsive">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Medicine</th>
                    <th>Dosage</th>
                    <th>Instructions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="med : ${medications}">
                    <td th:text="${med.patient.username}">Patient</td>
                    <td th:text="${med.doctor.username}">Doctor</td>
                    <td th:text="${med.medicationName}">Medicine</td>
                    <td th:text="${med.dosage}">Dosage</td>
                    <td th:text="${med.instructions}">Instructions</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
