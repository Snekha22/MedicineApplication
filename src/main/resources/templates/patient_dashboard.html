<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patient Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
          background-image: radial-gradient( circle 1091px at 106.5% 111.5%,  rgba(250,246,213,1) 0.1%, rgba(218,147,93,1) 42.2%, rgba(137,86,67,1) 74.3%, rgba(67,39,39,1) 100.2% );
         
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .dashboard-container {
            width: 33%;
            padding: 40px;
            border-radius: 15px;
            border-radius: 15px;
           box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           -webkit-box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           -moz-box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           background-image: linear-gradient( 109.6deg,  rgba(255,253,208,1) 11.2%, rgba(153,102,51,1) 91% );
           animation: slideIn 0.8s ease-out forwards;
        }
        .dashboard-title {
            text-align: center;
              color:#674f04; 
            background-color: background-image: linear-gradient( 100.1deg,  rgba(217,157,38,1) 16.8%, rgba(247,213,110,1) 77.3% );
            font-family: serif;
            font-weight: 900;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in-out;
        }
        .dashboard-link {
            display: block;
            text-align: center;
            margin: 12px 0;
            font-weight: bold;
            padding: 14px;
            border-radius: 10px;
            background-image: linear-gradient( 89.8deg,  rgba(222,74,74,1) 4.7%, rgba(30,29,29,1) 120.3% );
           color: oklch(0.929 0.013 255.508);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .dashboard-link:hover {
           background-image: radial-gradient( circle 691px at 23.3% 17.5%,  rgba(241,122,59,0.91) 0%, rgba(249,224,196,1) 72.3% );
           color: oklch(0.421 0.095 57.708);
            transform: translateY(-3px);
        }
        .logout-btn {
            background-color: #dc3545 !important;
            
        }
        .logout-btn:hover {
            background-color: #a71d2a !important;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <h2 class="dashboard-title">Welcome, Patient</h2>
    <a th:href="@{/appointments/book}" class="dashboard-link">Book Appointment</a>
    <a th:href="@{/appointments/my}" class="dashboard-link">My Appointments</a>
    <a th:href="@{/medications/my}" class="dashboard-link">My Medications</a>
    <a th:href="@{/logout}" class="dashboard-link logout-btn">Logout</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
