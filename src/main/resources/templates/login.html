<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
          background-image: radial-gradient( circle 1091px at 106.5% 111.5%,  rgba(250,246,213,1) 0.1%, rgba(218,147,93,1) 42.2%, rgba(137,86,67,1) 74.3%, rgba(67,39,39,1) 100.2% );

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            width: 40%;
            padding: 40px;
            border-radius: 20px;
           box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           -webkit-box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           -moz-box-shadow: 29px 33px 36px -9px rgba(53,0,0,1);
           background-image: linear-gradient( 109.6deg,  rgba(255,253,208,1) 11.2%, rgba(153,102,51,1) 91% );

            opacity: 0;
            animation: slideIn 1s ease-out forwards;
        }
        h2 {
            text-align: center;
            color: #674f04; 
            font-family: serif;
            font-weight: 900;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in-out;
        }
        label {
            color: #a28f70; 
            font-weight: 600;
            font-size: 1.1em;
        }
        input {
            width: 100%;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 3em;
            background-color: #f8f9f9;
            transition: all 0.5s ease;
        }
        input:focus {
            border-color: #2a9df4;
            box-shadow: 0 0 5px rgba(42, 157, 244, 0.6);
        }
        button {
             background: #F0C27B;  /* fallback for old browsers */
background: -webkit-linear-gradient(to right, #4B1248, #F0C27B);  /* Chrome 10-25, Safari 5.1-6 */
background: linear-gradient(to right, #4B1248, #F0C27B); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
          color: white;
           
            cursor: pointer;
            border: none;
            transition: background-color 0.3s, transform 0.3s ease;
            padding: 10px;
            width: 100%;
            font-weight: 700;
             font-family: Georgia, serif;
           
            border-radius: 5px;
        }
        button:hover {
          
        background: #603813;  /* fallback for old browsers */
background: -webkit-linear-gradient(to right, #b29f94, #603813);  /* Chrome 10-25, Safari 5.1-6 */
background: linear-gradient(to right, #b29f94, #603813); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */


           border-color: #7b3306;
            font-weight: 700;
            font-family: serif;

         
            transform: translateY(2px);
        }
        .text-danger {
            font-size: 0.95em;
        }

        /* Registration Link Styling */
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
            color: #674f04; 
        }

        .register-link a {
            color:  #403121; 
            text-decoration: none;
            font-weight: bold;
            padding: 5px 0;
            transition: color 0.3s ease, text-decoration 0.3s ease;
        }

        .register-link a:hover {
            color: #a65e09; 
            text-decoration: underline;
        }

        /* Animations */
        @keyframes slideIn {
            0% {
                transform: translateY(-30px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <button type="submit">Login</button>
        </form>

        <!-- Error message for invalid login -->
        <p th:if="${param.error}" class="text-danger text-center mt-3">Invalid username or password</p>

        <!-- Registration Link -->
        <div class="register-link">
            <p>If you don't have an account, <a href="/register">click here to register</a>.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
